<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação Pós-Sorting - Painel Ciclo AM e PM</title>
    <!-- Bibliotecas externas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 20px; color: #1e293b; }
        .tabs-nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background-color: #e2e8f0; color: #475569; font-weight: 600; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
        .tab-btn.active { background-color: #2563eb; color: #ffffff; }
        .tab-content { display: none; background: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .tab-content.active { display: block; }
        .chart-wrapper { position: relative; height: 380px; width: 100%; max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>

    <!-- Navegação por Abas -->
    <div class="tabs-nav">
        <button class="tab-btn active" onclick="trocarAba(event, 'aba-geral')">Visão Geral</button>
        <button class="tab-btn" onclick="trocarAba(event, 'aba-ciclo-am-pm')">Painel Ciclo AM e PM</button>
    </div>

    <!-- Aba Geral -->
    <div id="aba-geral" class="tab-content active">
        <h2>Painel Principal</h2>
        <p>Selecione a aba do Ciclo AM e PM para carregar os gráficos de acompanhamento.</p>
    </div>

    <!-- Aba Painel Ciclo AM e PM -->
    <div id="aba-ciclo-am-pm" class="tab-content">
        <h2>Acompanhamento do Ciclo AM vs PM</h2>
        <div class="chart-wrapper">
            <canvas id="canvasCicloAMPM"></canvas>
        </div>
    </div>

    <script>
        // Array de dados global da sua aplicação (Automação Pós-Sorting)[cite: 1]
        let historicoPacotes = [
            { id: "PKT-1001", ciclo: "AM", status: "Entregue" },
            { id: "PKT-1002", ciclo: "AM", status: "Retido no Piso" },
            { id: "PKT-1003", ciclo: "AM", status: "Entregue" },
            { id: "PKT-1004", ciclo: "PM", status: "Entregue" },
            { id: "PKT-1005", ciclo: "PM", status: "Retido no Piso" },
            { id: "PKT-1006", ciclo: "PM", status: "Retido no Piso" },
            { id: "PKT-1007", ciclo: "PM", status: "Entregue" }
        ];

        // Variável global para controle da instância do Chart.js
        let instanciaGraficoCiclo = null;

        // Lógica de troca de abas com correção de renderização de Canvas
        function trocarAba(event, idAba) {
            document.querySelectorAll('.tab-content').forEach(aba => aba.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            document.getElementById(idAba).classList.add('active');
            event.currentTarget.classList.add('active');

            // Garante que o gráfico só será gerado quando a aba estiver visível no DOM
            if (idAba === 'aba-ciclo-am-pm') {
                setTimeout(() => {
                    renderizarGraficoCiclo(historicoPacotes);
                }, 50);
            }
        }

        // Função de renderização robusta
        function renderizarGraficoCiclo(pacotes) {
            const canvas = document.getElementById('canvasCicloAMPM');
            if (!canvas) return;

            // Tratamento contra dados nulos/indefinidos
            const dadosSeguros = Array.isArray(pacotes) ? pacotes : [];
            const volumeAM = dadosSeguros.filter(p => p.ciclo === 'AM').length || 0;
            const volumePM = dadosSeguros.filter(p => p.ciclo === 'PM').length || 0;

            // Destrói o gráfico anterior caso já exista para evitar erros de re-instanciação
            if (instanciaGraficoCiclo instanceof Chart) {
                instanciaGraficoCiclo.destroy();
            }

            const ctx = canvas.getContext('2d');
            instanciaGraficoCiclo = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Ciclo AM', 'Ciclo PM'],
                    datasets: [{
                        label: 'Volume de Pacotes',
                        data: [volumeAM, volumePM],
                        backgroundColor: ['#2563eb', '#f59e0b'],
                        borderColor: ['#1d4ed8', '#d97706'],
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1, precision: 0 }
                        }
                    },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        title: { display: true, text: 'Total Processado por Turno' }
                    }
                }
            });
        }
    </script>
</body>
</html>
